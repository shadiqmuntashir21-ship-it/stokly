name: STOKLY Development Checks
on:
  push:
    branches: [feat/pwa-foundation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://fake:fake@127.0.0.1:5432/stokly
      BETTER_AUTH_SECRET: ci-compile-only-synthetic-secret-do-not-use-in-production
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
